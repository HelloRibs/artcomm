# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable
  Exclude:
    - bin/**/*
    - db/schema.rb
    - vendor/**/*
    - tmp/**/*
    - storage/**/*
    - node_modules/**/*

# Specs read better as long descriptive blocks than as extracted helpers.
RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/NestedGroups:
  Max: 4

# Integration specs cover wiring and configuration, not a single class.
RSpec/DescribeClass:
  Exclude:
    - spec/integration/**/*_spec.rb
